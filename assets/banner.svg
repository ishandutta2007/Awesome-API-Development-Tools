<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".3"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#6366f1" fill-opacity=".2"/></pattern><filter id="blur-orb" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur stdDeviation="70"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.15)}}@keyframes shimmer{0%{stop-color:#6366f1}50%{stop-color:#ec4899}}.orb-1{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:pulseGlow 9s ease-in-out infinite alternate-reverse;transform-origin:1000px 260px}.bg-card-1{animation:floatSlow 8s ease-in-out infinite}.bg-card-2{animation:floatReverse 9s ease-in-out infinite}.stream-line{stroke-dasharray:8,12;animation:dashMove 3s linear infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:500}.code-font{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,Consolas,Monaco,monospace}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#cyber-grid)" rx="16"/><circle cx="220" cy="110" r="140" fill="#4f46e5" class="orb-1" filter="url(#blur-orb)"/><circle cx="980" cy="240" r="160" fill="#ec4899" class="orb-2" filter="url(#blur-orb)"/><circle cx="600" cy="180" r="120" fill="#06b6d4" filter="url(#blur-orb)" opacity=".15"/><path fill="none" stroke="#6366f1" stroke-opacity=".4" stroke-width="2" d="M 100 80 Q 300 20 500 90 T 900 60 T 1120 120" class="stream-line"/><path fill="none" stroke="#ec4899" stroke-opacity=".3" stroke-width="2" d="M 80 280 Q 400 340 700 270 T 1140 290" class="stream-line"/><g class="bg-card-1" opacity=".6"><rect width="160" height="42" x="70" y="55" fill="url(#card-grad)" stroke="#475569" stroke-width="1" rx="21"/><circle cx="92" cy="76" r="6" fill="#10b981"/><text x="108" y="81" fill="#cbd5e1" class="code-font" font-size="12" font-weight="600">GET /graphql</text></g><g class="bg-card-2" opacity=".6"><rect width="160" height="42" x="970" y="60" fill="url(#card-grad)" stroke="#475569" stroke-width="1" rx="21"/><circle cx="992" cy="81" r="6" fill="#38bdf8"/><text x="1008" y="86" fill="#cbd5e1" class="code-font" font-size="12" font-weight="600">gRPC :: Stream</text></g><g class="bg-card-1" opacity=".55"><rect width="175" height="42" x="960" y="260" fill="url(#card-grad)" stroke="#475569" stroke-width="1" rx