<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#6366f1" fill-opacity="0.2" />
    </pattern>

    <filter id="blur-orb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes shimmer {
        0% { stop-color: #6366f1; }
        50% { stop-color: #ec4899; }
        100% { stop-color: #6366f1; }
      }
      .orb-1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .orb-2 {
        animation: pulseGlow 9s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 260px;
      }
      .bg-card-1 {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .bg-card-2 {
        animation: floatReverse 9s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8, 12;
        animation: dashMove 3s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
      }
      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyber-grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="#4f46e5" filter="url(#blur-orb)" />
  <circle class="orb-2" cx="980" cy="240" r="160" fill="#ec4899" filter="url(#blur-orb)" />
  <circle cx="600" cy="180" r="120" fill="#06b6d4" opacity="0.15" filter="url(#blur-orb)" />

  <!-- Animated Data Connection Streams (Background) -->
  <path class="stream-line" d="M 100 80 Q 300 20 500 90 T 900 60 T 1120 120" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  <path class="stream-line" d="M 80 280 Q 400 340 700 270 T 1140 290" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.3" />

  <!-- Decorative Background Pill / Micro-cards (Lower z-index, positioned on flanks) -->
  <g class="bg-card-1" opacity="0.6">
    <rect x="70" y="55" width="160" height="42" rx="21" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
    <circle cx="92" cy="76" r="6" fill="#10b981" />
    <text x="108" y="81" fill="#cbd5e1" class="code-font" font-size="12" font-weight="600">GET /graphql</text>
  </g>

  <g class="bg-card-2" opacity="0.6">
    <rect x="970" y="60" width="160" height="42" rx="21" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
    <circle cx="992" cy="81" r="6" fill="#38bdf8" />
    <text x="1008" y="86" fill="#cbd5e1" class="code-font" font-size="12" font-weight="600">gRPC :: Stream</text>
  </g>

  <g class="bg-card-1" opacity="0.55">
    <rect x="960" y="260" width="175" height="42" rx="21" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
    <circle cx="982" cy="281" r="6" fill="#f59e0b" />
    <text x="998" y="286" fill="#cbd5e1" class="code-font" font-size="12" font-weight="600">200 OK • 12ms</text>
  </g>

  <g class="bg-card-2" opacity="0.55">
    <rect x="70" y="260" width="170" height="42" rx="21" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
    <circle cx="92" cy="281" r="6" fill="#a855f7" />
    <text x="108" y="286" fill="#cbd5e1" class="code-font" font-size="12" font-weight="600">Schema Registry</text>
  </g>

  <!-- FOREGROUND CONTAINER: Elevated solid presence, guaranteed high legibility -->
  <g transform="translate(600, 175)">
    <!-- Central Halo Backdrop -->
    <rect x="-420" y="-120" width="840" height="235" rx="24" fill="#0b1120" fill-opacity="0.78" stroke="#334155" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- Top Badge Pill -->
    <g transform="translate(0, -82)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text text-anchor="middle" y="5" fill="#c7d2fe" class="code-font" font-size="11" font-weight="700" letter-spacing="0.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title (Vibrant Gradient + Drop Shadow) -->
    <text text-anchor="middle" y="-22" class="title-text" font-size="44" fill="url(#primary-glow)" filter="url(#soft-glow)">
      Awesome API Development Tools
    </text>

    <!-- Subtitle (Bright White & Ice Slate) -->
    <text text-anchor="middle" y="20" class="sub-text" font-size="17" fill="#f8fafc">
      Top SaaS Platforms &amp; Open-Source Projects for Modern API Engineering
    </text>

    <!-- Capability Tags / Badges in Foreground -->
    <text text-anchor="middle" y="52" class="sub-text" font-size="14" fill="#94a3b8" font-weight="400">
      GraphQL IDEs  •  API Clients  •  Multi-Protocol Testing  •  Schema Registries  •  Mocks &amp; Gateways
    </text>

    <!-- Tech Badges Footer Inside Central Container -->
    <g transform="translate(0, 84)">
      <rect x="-240" y="-12" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" x="-197" y="4" fill="#38bdf8" class="code-font" font-size="11" font-weight="600">REST</text>

      <rect x="-140" y="-12" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" x="-97" y="4" fill="#e879f9" class="code-font" font-size="11" font-weight="600">GraphQL</text>

      <rect x="-40" y="-12" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" x="2" y="4" fill="#4ade80" class="code-font" font-size="11" font-weight="600">gRPC</text>

      <rect x="60" y="-12" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" x="102" y="4" fill="#facc15" class="code-font" font-size="11" font-weight="600">WebSocket</text>

      <rect x="160" y="-12" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" x="202" y="4" fill="#fb7185" class="code-font" font-size="11" font-weight="600">SSE / MQTT</text>
    </g>
  </g>
</svg>